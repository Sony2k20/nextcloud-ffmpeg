name: Build Nextcloud Image

on:
  workflow_dispatch:
    inputs:
      nextcloud_version:
        description: "Nextcloud Base-Image Tag (z.B. 33.0.7)"
        required: true
        type: string
        default: "33.0.7"
      image_name:
        description: "Docker Hub Repository unter sony2k20"
        required: false
        type: string
        default: "nextcloud-ffmpeg"
      tag_latest:
        description: "Zusaetzlich als :latest taggen"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Ziel-Plattformen"
        required: false
        type: choice
        default: "linux/amd64"
        options:
          - "linux/amd64"
          - "linux/arm64"
          - "linux/amd64,linux/arm64"
      push:
        description: "In die Registry pushen"
        required: false
        type: boolean
        default: true

env:
  DOCKERHUB_USER: sony2k20

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Version und Image-Namen aufloesen
        id: version
        run: |
          VERSION="${{ inputs.nextcloud_version || vars.NEXTCLOUD_VERSION || '33.0.7' }}"
          NAME="${{ inputs.image_name || vars.IMAGE_NAME || 'nextcloud-ffmpeg' }}"
          if [ -z "$VERSION" ]; then
            echo "Keine Nextcloud-Version gesetzt." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.DOCKERHUB_USER }}/$NAME" >> "$GITHUB_OUTPUT"
          echo "Baue nextcloud:$VERSION -> ${{ env.DOCKERHUB_USER }}/$NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU einrichten
        if: contains(inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An Docker Hub anmelden
        if: ${{ inputs.push != false }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags und Labels erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ inputs.tag_latest != false }}
          labels: |
            org.opencontainers.image.title=nextcloud-ffmpeg
            org.opencontainers.image.description=Nextcloud mit ffmpeg fuer Video-Previews
            org.opencontainers.image.base.name=docker.io/library/nextcloud:${{ steps.version.outputs.version }}

      - name: Image bauen und pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.version.outputs.version }}
          push: ${{ inputs.push != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke-Test (ffmpeg vorhanden?)
        if: ${{ inputs.push != false && contains(inputs.platforms || 'linux/amd64', 'amd64') }}
        run: |
          IMAGE="${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          docker run --rm --entrypoint /usr/bin/ffmpeg "$IMAGE" -version
          docker run --rm --entrypoint sh "$IMAGE" -c 'php -v && ls /var/www/html/occ'

      - name: Zusammenfassung
        run: |
          {
            echo "### Nextcloud Image gebaut"
            echo ""
            echo "- Base: \`nextcloud:${{ steps.version.outputs.version }}\`"
            echo "- Plattformen: \`${{ inputs.platforms || 'linux/amd64' }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
